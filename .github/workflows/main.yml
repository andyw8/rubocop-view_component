name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    timeout-minutes: 10
    strategy:
      matrix:
        ruby:
          - '3.4.7'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  minimum_rubocop:
    runs-on: ubuntu-latest
    name: Minimum RuboCop ${{ matrix.ruby }}
    timeout-minutes: 10
    strategy:
      matrix:
        ruby:
          - '3.4.7'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install appraisal gemfiles
        run: bundle exec appraisal install
      - name: Run the default task against the oldest supported RuboCop
        run: bundle exec appraisal rubocop-minimum rake

  primer_verification:
    runs-on: ubuntu-latest
    name: Primer Verification
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
      - name: Verify against Primer ViewComponents
        run: script/verify primer

  govuk_verification:
    runs-on: ubuntu-latest
    name: x-govuk Components Verification
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
      - name: Verify against x-govuk Components
        run: script/verify govuk

  polaris_verification:
    runs-on: ubuntu-latest
    name: Polaris ViewComponents Verification
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
      - name: Verify against Polaris ViewComponents
        run: script/verify polaris
